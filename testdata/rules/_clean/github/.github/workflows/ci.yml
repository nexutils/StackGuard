name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20.11.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test with coverage
        run: npm test -- --coverage
      - uses: aquasecurity/trivy-action@0f7a1b2c3d4e5f60718293a4b5c6d7e8f9012345
        with:
          scan-type: fs
      - name: Notify on failure
        if: failure()
        run: echo "build failed"
