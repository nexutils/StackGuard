# Hardened reverse-proxy config.
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
worker_shutdown_timeout 30s;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
}

http {
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    client_max_body_size 10m;
    keepalive_timeout 65;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;

    log_format main '$remote_addr $request_id "$request" $status $request_time $upstream_response_time';
    access_log /var/log/nginx/access.log main;

    limit_req_zone $binary_remote_addr zone=req:10m rate=10r/s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header Referrer-Policy "no-referrer" always;

    upstream app {
        least_conn;
        keepalive 32;
        server 10.0.0.1:8080 max_fails=3 fail_timeout=10s;
        server 10.0.0.2:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 443 ssl default_server;
        server_name example.com;

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffering on;
            limit_req zone=req burst=20 nodelay;
        }

        location /healthz {
            access_log off;
            return 200 "ok";
        }

        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
    }
}
