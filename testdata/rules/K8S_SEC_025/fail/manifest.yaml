apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: app
spec:
  replicas: 2
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: web:1.0.0
          env:
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: s
                  key: k
