version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
        - name: var-naming
    gocritic:
      disabled-checks:
        - ifElseChain
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Writes to bufio/bytes buffers in reporters and CLI output cannot
      # meaningfully fail; errors surface on Flush.
      - linters: [errcheck]
        text: "Error return value of `fmt.Fprint"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nexutils/StackGuard
