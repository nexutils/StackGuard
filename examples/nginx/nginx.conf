events {}

http {
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

    server {
        listen 443 ssl;
        server_name shop.example.com;

        location /downloads/ {
            root /srv;
            autoindex on;
        }

        location / {
            proxy_pass http://127.0.0.1:8080;
        }
    }
}
