services:
  api:
    image: ghcr.io/acme/api:1.8.2
    user: root
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]

  postgres:
    image: postgres:16.3
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    healthcheck:
      test: ["CMD", "pg_isready"]
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7.2.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    mem_limit: 256m
