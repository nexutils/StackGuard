name: Deploy site to GitHub Pages

# Publishes the landing page in web/ to GitHub Pages.
# Repository setting required once: Settings > Pages > Build and deployment >
# Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "cmd/playground/**"
      - "internal/**"
      - "rules/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build playground WASM
        run: GOOS=js GOARCH=wasm go build -o web/stackguard.wasm ./cmd/playground
      - name: Copy wasm_exec.js
        run: cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/wasm_exec.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
