id: COMP_DB_008
title: Database backup strategy not detected
severity: WARNING
category: reliability
target: compose
resource: service
enabled: false
message: "Service '{{ .Resource.Name }}' — Database backup strategy not detected"
description: |
  A database service has no `backup.policy` label. Uses an organisation-
  specific label; enable the rule if you use that convention.
remediation: |
  Add a `backup.policy` label and a backup job.
when:
  path: image
  regex: '(^|/)(postgres|postgresql|postgis|timescaledb[a-z-]*|mysql|mariadb|percona|mongo|mongodb-community-server|redis|valkey|elasticsearch|opensearch|rabbitmq|cassandra|mssql/server|clickhouse-server|neo4j|influxdb|couchdb|cockroach)(:|@|$)'
query:
  path: labels."backup.policy"
  not_exists: true
---
id: COMP_DB_009
title: Redis without password
severity: WARNING
category: security
target: compose
resource: service
message: "Service '{{ .Resource.Name }}' — Redis without password"
pass_message: Redis services require a password
description: |
  Redis accepts unauthenticated connections by default; anyone who can reach
  it can read and change all data.
remediation: |
  Start Redis with `--requirepass` read from a secret, or configure ACLs.
when:
  path: image
  regex: '(^|/)(redis|redis-stack|redis-stack-server|valkey|keydb)(:|@|$)'
query:
  all:
    - not:
        path: command
        regex: 'requirepass|--aclfile'
    - not:
        path: environment.*
        regex: '^REDIS_PASSWORD(_FILE)?='
---
id: COMP_PROD_001
title: Production service uses development settings
severity: WARNING
category: operational
target: compose
resource: service
message: "Service '{{ .Resource.Name }}' — Production service uses development settings"
description: |
  Debug modes and development servers leak stack traces, disable caching and
  are not built for production traffic.
remediation: |
  Use production settings, and keep development overrides in
  `compose.override.yaml`.
query:
  any:
    - path: environment.*
      regex: '(?i)^(node_env|app_env|env|environment|flask_env|rails_env|rack_env|mix_env|aspnetcore_environment|spring_profiles_active)=.*(dev|local|test)'
    - path: environment.*
      regex: '(?i)^(debug|app_debug|flask_debug|django_debug)=(1|true|yes|on)$'
    - path: command
      regex: '(--reload|--debug|--watch|nodemon|runserver|npm run dev|yarn dev|pnpm dev)'
---
id: COMP_PROD_002
title: Backup strategy not detected
severity: WARNING
category: reliability
target: compose
resource: project
enabled: false
message: "Project '{{ .Resource.Name }}' — Backup strategy not detected"
description: |
  No backup tool or `backup.policy` label found in the project. Backups often
  live outside the compose file, so this is a heuristic; enable it if backups
  are expected in the same file.
remediation: |
  Add a backup service or document the policy with labels.
query:
  all:
    - not:
        path: services.*.labels."backup.policy"
        exists: true
    - not:
        path: services.*.image
        regex: '(restic|borg|velero|duplicati|docker-volume-backup|postgres-backup|pgbackrest|wal-g|barman)'
---
id: COMP_PROD_003
title: Monitoring integration not detected
severity: WARNING
category: operational
target: compose
resource: project
enabled: false
message: "Project '{{ .Resource.Name }}' — Monitoring integration not detected"
description: |
  No monitoring agent or scrape label found in the project. Monitoring is
  often external, so this is a heuristic; enable it if agents are expected in
  the same file.
remediation: |
  Add a monitoring agent or `prometheus.io/scrape` labels.
query:
  all:
    - not:
        path: services.*.image
        regex: '(prometheus|node-exporter|cadvisor|grafana/agent|grafana/alloy|datadog/agent|newrelic|opentelemetry-collector|telegraf|netdata|zabbix)'
    - not:
        path: services.*.labels."prometheus.io/scrape"
        equals: "true"
---
