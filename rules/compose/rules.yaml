query:
  not:
    path: services.*.image
    regex: '(alertmanager|grafana/oncall|datadog/agent|zabbix|uptime-kuma|gatus)'
---
id: COMP_PROD_005
title: Service ownership labels missing
severity: WARNING
category: maintainability
target: compose
resource: service
enabled: false
message: "Service '{{ .Resource.Name }}' — Service ownership labels missing"
description: |
  Without an owner or team label nobody knows who to page. Uses organisation-
  specific labels; enable the rule if you use that convention.
remediation: |
  Add an `owner` or `team` label.
query:
  all:
    - path: labels.owner
      not_exists: true
    - path: labels.team
      not_exists: true
---
id: COMP_PROD_006
title: Environment metadata missing
severity: WARNING
category: maintainability
target: compose
resource: service
enabled: false
message: "Service '{{ .Resource.Name }}' — Environment metadata missing"
description: |
  Services without an `environment` label are hard to tell apart across
  stages. Uses an organisation-specific label; enable the rule if you use that
  convention.
remediation: |
  Add an `environment` label.
query:
  path: labels.environment
  not_exists: true
---
id: COMP_PROD_007
title: Recovery strategy not detected
severity: WARNING
category: reliability
target: compose
resource: service
enabled: false
message: "Service '{{ .Resource.Name }}' — Recovery strategy not detected"
description: |
  A `tier: critical` service has neither a rollback configuration nor a
  runbook label. Uses organisation-specific labels; enable the rule if you use
  that convention.
remediation: |
  Add `deploy.rollback_config` and a `runbook` label.
when:
  path: labels.tier
  equals: critical
query:
  all:
    - path: deploy.rollback_config
      not_exists: true
    - path: labels.runbook
      not_exists: true
---
id: COMP_PROD_008
title: Critical service is a single point of failure
severity: WARNING
category: reliability
target: compose
resource: service
enabled: false
message: "Service '{{ .Resource.Name }}' — Critical service is a single point of failure"
description: |
  A `tier: critical` service runs one replica with no failover label. Uses
  organisation-specific labels; enable the rule if you use that convention.
remediation: |
  Run at least two replicas, or document the failover mechanism.
when:
  path: labels.tier
  equals: critical
query:
  all:
    - not:
        path: deploy.mode
        equals: global
    - any:
        - path: deploy.replicas
          not_exists: true
        - path: deploy.replicas
          lt: 2
    - path: labels.failover
      not_exists: true
---
id: COMP_PROD_009
title: High availability configuration not detected
severity: INFO
category: reliability
target: compose
resource: project
message: "Project '{{ .Resource.Name }}' — High availability configuration not detected"
description: |
  No service in the project runs more than one replica, so every host or
  container failure is an outage.
remediation: |
  Run critical services with `deploy.replicas: 2` or more.
query:
  all:
    - not:
        path: services.*.deploy.replicas
        gte: 2
    - not:
        path: services.*.deploy.mode
        equals: global
---
id: COMP_PROD_010
title: Disaster recovery readiness not detected
severity: WARNING
category: reliability
target: compose
resource: project
enabled: false
message: "Project '{{ .Resource.Name }}' — Disaster recovery readiness not detected"
description: |
  No `dr.policy` label anywhere in the project. Uses an organisation-specific
  label; enable the rule if you use that convention.
remediation: |
  Document the disaster recovery policy with `dr.policy` labels.
query:
  all:
    - not:
        path: services.*.labels."dr.policy"
        exists: true
    - not:
        path: volumes.*.labels."dr.policy"
        exists: true
---
id: COMP_PROD_011
title: Obsolete version attribute is used
severity: INFO
category: maintainability
target: compose
resource: project
message: "Project '{{ .Resource.Name }}' — Obsolete version attribute is used"
description: |
  The top-level `version` key is obsolete in the Compose Specification and
  ignored by Compose v2.
remediation: |
  Remove `version:`.
query:
  path: version
  exists: true
---
id: COMP_PROD_012
title: Project name is not defined
severity: INFO
category: maintainability
target: compose
resource: project
message: "Project '{{ .Resource.Name }}' — Project name is not defined"
description: |
  Without `name`, the project name comes from the directory, so the same file
  creates different resource names in different checkouts.
remediation: |
  Set a top-level `name:`.
query:
  path: name
  not_exists: true
---
id: COMP_PROD_013
title: Interactive or development-only settings enabled
severity: WARNING
category: operational
target: compose
resource: service
message: "Service '{{ .Resource.Name }}' — Interactive or development-only settings enabled"
description: |
  `develop` (compose watch), `tty` and `stdin_open` are development
  conveniences.
remediation: |
  Move them into a development override file.
query:
  any:
    - path: develop
      exists: true
    - path: tty
      equals: true
    - path: stdin_open
      equals: true
---
id: COMP_PROD_014
title: Debug or admin tool is not behind a profile
severity: WARNING
category: security
target: compose
resource: service
message: "Service '{{ .Resource.Name }}' — Debug or admin tool is not behind a profile"
description: |
  Admin UIs and debugging tools (adminer, pgAdmin, mailhog, ...) should only
  start on demand; running them always adds an attack surface.
remediation: |
  Add the service to a profile, e.g. `profiles: [debug]`.
when:
  path: image
  regex: '(^|/)(adminer|phpmyadmin|pgadmin4?|mongo-express|redis-commander|redisinsight|mailhog|mailpit|dozzle|kafdrop|kafka-ui|swagger-ui|localstack|whoami)(:|@|$)'
query:
  path: profiles
  not_exists: true
