version: 2

project_name: stackguard

before:
  hooks:
    - go mod tidy

builds:
  - id: stackguard
    main: ./cmd/stackguard
    binary: stackguard
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/nexutils/StackGuard/internal/version.Version={{ .Version }}
      - -X github.com/nexutils/StackGuard/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/nexutils/StackGuard/internal/version.Date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

brews:
  - name: stackguard
    repository:
      owner: nexutils
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/nexutils/StackGuard"
    description: "Scan infrastructure and deployment configuration for production-readiness issues"
    license: "Apache-2.0"
    skip_upload: auto
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    test: |
      system "#{bin}/stackguard", "version"

# Scoop bucket. Publishes a manifest to github.com/nexutils/scoop-bucket.
# Install with: scoop bucket add nexutils https://github.com/nexutils/scoop-bucket
#               scoop install stackguard
scoops:
  - name: stackguard
    repository:
      owner: nexutils
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/nexutils/StackGuard"
    description: "Scan infrastructure and deployment configuration for production-readiness issues"
    license: "Apache-2.0"
    skip_upload: auto
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
